<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="bt bd">
  <title id="bt">Javi Giraldo, Database Developer moving into Data Engineering</title>
  <desc id="bd">A lattice of data cells with a lit route ascending across four stages: ingest, model, orchestrate and serve.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/><stop offset="1" stop-color="#112240"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8"/>
    </pattern>
    <radialGradient id="depth" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.13"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="route" gradientUnits="userSpaceOnUse" x1="670" y1="217" x2="1120" y2="89">
      <stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#dots)" opacity="0.07"/>
  <ellipse cx="900" cy="150" rx="300" ry="150" fill="url(#depth)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="64" y="84" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#38BDF8" letter-spacing="1">&gt; reliable data at scale, efficient systems by design</text>
    <text x="62" y="146" font-size="62" font-weight="700" fill="#F8FAFC">Javi Giraldo</text>
    <text x="64" y="192" font-size="26" fill="#CBD5E1">Database Developer <tspan fill="#38BDF8">→</tspan> Data Engineer</text>
    <text x="64" y="236" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="16" fill="#7DD3FC">SQL Server · SSIS · Python · PySpark · AWS · Airflow</text>
    <text x="64" y="266" font-size="15" fill="#64748B">Bogotá, Colombia · building data solutions for corporate travel since 2024</text>
  </g>

